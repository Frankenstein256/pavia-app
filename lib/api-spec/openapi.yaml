openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: freelancers
  - name: properties
  - name: courses
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /freelancers:
    get:
      operationId: listFreelancers
      tags: [freelancers]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of freelancers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerListResponse"
    post:
      operationId: createFreelancer
      tags: [freelancers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreelancerInput"
      responses:
        "201":
          description: Freelancer profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
        - name: bedrooms
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
    post:
      operationId: createProperty
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Property listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course with lessons and quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses/{id}/progress:
    get:
      operationId: getCourseProgress
      tags: [courses]
      summary: Get current user progress for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress record (may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgressResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: updateCourseProgress
      tags: [courses]
      summary: Update lesson completion progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgressInput"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgressResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses/{id}/quiz:
    post:
      operationId: submitQuiz
      tags: [courses]
      summary: Submit quiz answers and get result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmissionInput"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResultResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses/{id}/certificate:
    post:
      operationId: claimCertificate
      tags: [courses]
      summary: Claim a certificate after passing the quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCertificateInput"
      responses:
        "200":
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Quiz not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      required: [id, fullName, email, phone, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    SignupInput:
      type: object
      required: [fullName, email, phone, password]
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Freelancer:
      type: object
      required: [id, name, skillCategory, location, rateGhs, bio, email, phone, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        skillCategory:
          type: string
        location:
          type: string
        rateGhs:
          type: integer
        bio:
          type: string
        portfolioImageUrl:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
        createdAt:
          type: string

    FreelancerInput:
      type: object
      required: [name, skillCategory, location, rateGhs, bio, email, phone]
      properties:
        name:
          type: string
          minLength: 1
        skillCategory:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        rateGhs:
          type: integer
          minimum: 1
        bio:
          type: string
          minLength: 10
        portfolioImageUrl:
          type: string
        email:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1

    FreelancerListResponse:
      type: object
      required: [freelancers]
      properties:
        freelancers:
          type: array
          items:
            $ref: "#/components/schemas/Freelancer"

    FreelancerResponse:
      type: object
      required: [freelancer]
      properties:
        freelancer:
          $ref: "#/components/schemas/Freelancer"

    Property:
      type: object
      required: [id, title, description, location, monthlyRentGhs, bedrooms, bathrooms, amenities, landlordName, landlordContact, availableDate, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        location:
          type: string
        monthlyRentGhs:
          type: integer
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        amenities:
          type: string
        landlordName:
          type: string
        landlordContact:
          type: string
        photoUrl:
          type: string
          nullable: true
        availableDate:
          type: string
        createdAt:
          type: string

    PropertyInput:
      type: object
      required: [title, description, location, monthlyRentGhs, bedrooms, bathrooms, landlordName, landlordContact, availableDate]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        monthlyRentGhs:
          type: integer
          minimum: 1
        bedrooms:
          type: integer
          minimum: 0
        bathrooms:
          type: integer
          minimum: 1
        amenities:
          type: string
        landlordName:
          type: string
          minLength: 1
        landlordContact:
          type: string
          minLength: 1
        photoUrl:
          type: string
        availableDate:
          type: string
          minLength: 1

    PropertyListResponse:
      type: object
      required: [properties]
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"

    PropertyResponse:
      type: object
      required: [property]
      properties:
        property:
          $ref: "#/components/schemas/Property"

    CourseListItem:
      type: object
      required: [id, title, description, category, level, durationHours, instructor, certificatePriceGhs, lessonCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
        durationHours:
          type: integer
        instructor:
          type: string
        coverImageUrl:
          type: string
          nullable: true
        certificatePriceGhs:
          type: integer
        lessonCount:
          type: integer
        createdAt:
          type: string

    Lesson:
      type: object
      required: [id, courseId, orderNum, title, content, createdAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        orderNum:
          type: integer
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string

    QuizQuestion:
      type: object
      required: [id, courseId, orderNum, question, optionA, optionB, optionC, optionD]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        orderNum:
          type: integer
        question:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        optionC:
          type: string
        optionD:
          type: string

    CourseDetail:
      type: object
      required: [id, title, description, category, level, durationHours, instructor, certificatePriceGhs, lessonCount, createdAt, lessons, quizQuestions]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        level:
          type: string
        durationHours:
          type: integer
        instructor:
          type: string
        coverImageUrl:
          type: string
          nullable: true
        certificatePriceGhs:
          type: integer
        lessonCount:
          type: integer
        createdAt:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        quizQuestions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"

    CourseProgress:
      type: object
      required: [id, userId, courseId, completedLessonIds, quizPassed, certificatePurchased, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        completedLessonIds:
          type: string
        quizScore:
          type: integer
          nullable: true
        quizPassed:
          type: boolean
        certificatePurchased:
          type: boolean
        certificateName:
          type: string
          nullable: true
        certificateId:
          type: string
          nullable: true
        updatedAt:
          type: string

    UpdateProgressInput:
      type: object
      required: [completedLessonIds]
      properties:
        completedLessonIds:
          type: string

    QuizAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: integer
        answer:
          type: string

    QuizSubmissionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"

    QuizResult:
      type: object
      required: [score, total, passed]
      properties:
        score:
          type: integer
        total:
          type: integer
        passed:
          type: boolean

    ClaimCertificateInput:
      type: object
      required: [name, paymentReference]
      properties:
        name:
          type: string
          minLength: 1
        paymentReference:
          type: string
          minLength: 1

    CertificateData:
      type: object
      required: [certificateId, courseTitle, recipientName, instructor, issuedAt]
      properties:
        certificateId:
          type: string
        courseTitle:
          type: string
        recipientName:
          type: string
        instructor:
          type: string
        issuedAt:
          type: string

    CourseListResponse:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseListItem"

    CourseDetailResponse:
      type: object
      required: [course]
      properties:
        course:
          $ref: "#/components/schemas/CourseDetail"

    CourseProgressResponse:
      type: object
      required: [progress]
      properties:
        progress:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CourseProgress"

    QuizResultResponse:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/QuizResult"

    CertificateResponse:
      type: object
      required: [certificate]
      properties:
        certificate:
          $ref: "#/components/schemas/CertificateData"
